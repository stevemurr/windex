# windex — full stack for rootless podman on the Spark (DGX GB10).
#   data plane : postgres 16 + qdrant 1.18.2 (on the local NVMe)
#   app plane  : API + Source scheduler + Pipeline workers + Module sandbox
#
# The models (litellm gateway + vLLM) run in a SEPARATE podman project; windex reaches
# the gateway at host.containers.internal:4000 (host-published), so it stays decoupled
# from the model compose network.
#
# Build the app image first (compose references it):
#   podman build -t localhost/windex-app:latest -f Containerfile .
# Bring up:
#   podman-compose -p windex -f compose.yaml up -d
#
# Data lives OUTSIDE the repo, all of it on the local NVMe:
#   ${WINDEX_STACK_DATA:-/home/murr/windex-stack}  pgdata + qdrant storage
#   ${WINDEX_DATA_ROOT:-/home/murr/windex-data}    parquet staging + downloads
#
# The corpus moved off the CIFS share (//192.168.1.231/External) on 2026-07-24. That
# share is a general-purpose drive on ANOTHER machine, and depending on it put a
# network round-trip in the embed reader's parquet hot path, made the corpus
# unavailable whenever the Mac was down, and caused the boot race that ops/reboot's
# mount guard existed to paper over (and which it lost after a power outage, because
# the Mac's own boot time is unbounded from the Spark's point of view). Staging is
# 31G against 1.7T free locally, so there was never a capacity argument for it.
# The old tree is still on the share as an archive.

x-windex-app: &windex-app
    image: localhost/windex-app:latest
    env_file: .env
    # Override the host-oriented .env values for in-container networking:
    #  - postgres/qdrant reached by service name on the windex compose network
    #  - the model gateway reached on the host via host.containers.internal
    environment:
        - WINDEX_PG_DSN=postgresql://${WINDEX_PG_USER:-windex}:${WINDEX_PG_PASSWORD:-windex}@postgres:5432/${WINDEX_PG_DB:-windex}
        - WINDEX_QDRANT_URL=http://qdrant:6333
        - WINDEX_EMBED_ENDPOINT=http://host.containers.internal:4000
        # Query embed deadline. Lowered 8→3s so a GPU-contended query embed (during the
        # backlog backfill) fails fast and search degrades to lexical in ~3s instead of
        # hanging ~8s. Inert for the loops (they do bulk embeds, not query embeds).
        - WINDEX_EMBED_QUERY_TIMEOUT=3
        # Drain newest-first (pipeline.newest_first) so freshly-harvested docs embed
        # ahead of the ~9M old backlog — freshness over completeness.
        - WINDEX_EMBED_ORDER=newest
        # Rerank stays OFF for now. The query-FORMAT bug is fixed (windex now sends the
        # Qwen3-Reranker "<Instruct>:/<Query>:" wrapper — verified it ranks correctly in
        # controlled tests), but a RESIDUAL reranker-quality issue remains: certain real
        # docs still score a spurious ~1.0, so on the full candidate pool rerank-ON is
        # worse than rerank-OFF. Needs a bf16-vs-NVFP4 recheck on realistic docs. To
        # re-enable once fixed: set this to http://host.containers.internal:4000.
        - WINDEX_RERANK_ENDPOINT=
        - WINDEX_JUDGE_ENDPOINT=http://host.containers.internal:4000
        # podman-compose's env_file parser keeps literal quotes/escapes (python-dotenv
        # on the host strips them), so the query prefix must be set here with a real
        # (YAML-escaped) newline — otherwise query embeddings get a malformed instruction.
        - "WINDEX_EMBED_QUERY_PREFIX=Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery: "
    extra_hosts:
        - "host.containers.internal:host-gateway"
    depends_on:
        - postgres
        - qdrant
    restart: always

x-windex-worker: &windex-worker
    <<: *windex-app
    # Pipeline workers read/write generation-scoped staging and artifacts.
    volumes:
        # Host path and container path are THE SAME on purpose: both sides
        # interpolate one variable, so `WINDEX_DATA_ROOT` means the same thing to a
        # container and to a host-side `uv run windex`. The previous split
        # (/mnt/windex-external-rw -> /mnt/windex-external) made the .env value
        # correct only inside a container; on the host it pointed at a root-owned
        # empty directory, so host CLI reads silently found nothing.
        - ${WINDEX_DATA_ROOT:-/home/murr/windex-data}:${WINDEX_DATA_ROOT:-/home/murr/windex-data}:rw

services:
    postgres:
        image: docker.io/library/postgres:16
        environment:
            - POSTGRES_USER=${WINDEX_PG_USER:-windex}
            - POSTGRES_PASSWORD=${WINDEX_PG_PASSWORD:-windex}
            - POSTGRES_DB=${WINDEX_PG_DB:-windex}
            - PGDATA=/var/lib/postgresql/data/pgdata
        volumes:
            - ${WINDEX_STACK_DATA:-/home/murr/windex-stack}/pgdata:/var/lib/postgresql/data
        ports:
            - "127.0.0.1:5432:5432"
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 20s

    qdrant:
        image: docker.io/qdrant/qdrant:v1.18.2
        environment:
            # Nudge Qdrant to memory-map segments early rather than keep them resident.
            - QDRANT__STORAGE__OPTIMIZERS__MEMMAP_THRESHOLD_KB=20000
        volumes:
            - ${WINDEX_STACK_DATA:-/home/murr/windex-stack}/qdrant:/qdrant/storage
        ports:
            - "127.0.0.1:6333:6333"
            - "127.0.0.1:6334:6334"
        restart: unless-stopped

    # --- Public search/data API + canonical admin control plane -------------
    windex-serve:
        <<: *windex-app
        # `build` here makes the stack reproducible; all app services share this image.
        build:
            context: .
            dockerfile: Containerfile
        command: ["serve", "--host", "0.0.0.0", "--port", "8100"]
        ports:
            - "8100:8100"
        volumes:
            # Host path and container path are THE SAME on purpose: both sides
        # interpolate one variable, so `WINDEX_DATA_ROOT` means the same thing to a
        # container and to a host-side `uv run windex`. The previous split
        # (/mnt/windex-external-rw -> /mnt/windex-external) made the .env value
        # correct only inside a container; on the host it pointed at a root-owned
        # empty directory, so host CLI reads silently found nothing.
        - ${WINDEX_DATA_ROOT:-/home/murr/windex-data}:${WINDEX_DATA_ROOT:-/home/murr/windex-data}:rw
        networks:
            - default
            - module-sandbox

    # --- Source trigger dispatcher ------------------------------------------
    windex-source-scheduler:
        <<: *windex-worker
        command: ["source-scheduler"]

    # --- Pipeline worker pool -----------------------------------------------
    # Executes canonical run_tasks. Four recyclable subprocess
    # slots share fleet-wide lane caps; cpu_heavy stays capped at one so a wiki
    # shard and datatrove extraction can never peak together.
    windex-worker:
        <<: *windex-worker
        command: ["worker", "--slots", "4", "--name", "production"]
        mem_limit: 40g
        stop_grace_period: 40s
        networks:
            - default
            - module-sandbox

    # Approved local code executes only here. The internal network lets the API
    # and worker submit JSONL jobs but provides no external route.
    windex-module-sandbox:
        image: localhost/windex-app:latest
        command: ["python", "-m", "windex.module_sandbox"]
        read_only: true
        tmpfs:
            - /tmp:rw,noexec,nosuid,nodev,size=64m
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        pids_limit: 16
        mem_limit: 512m
        cpus: 1.0
        restart: always
        networks:
            - module-sandbox

networks:
    default: {}
    module-sandbox:
        internal: true
