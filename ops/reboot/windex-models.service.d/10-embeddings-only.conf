# Two changes: wait for a usable CDI spec, and do not auto-start qwen3.6.
#
# 1. CDI gate. The GPU containers cannot start until nvidia-cdi-downconvert has
#    installed a 0.6.0 spec podman can read; at boot that service and this one
#    are in different systemd scopes (system vs user), so — as with the mount in
#    windex-data — we cannot express it as After= and poll a stamp file instead.
#    /run is tmpfs, so the stamp cannot survive a reboot and lie to us.
#    Non-fatal: on timeout we still bring up the CPU-only services (litellm,
#    prometheus, grafana) rather than leaving the box with nothing.
#
# 2. Explicit service list. The original ExecStart was a bare `up -d`, which
#    starts *every* service in podman-compose.yaml — including qwen3.6. That was
#    masked while GPU containers were failing on the stale CDI spec; once they
#    start working, a bare `up -d` would load a second large model alongside the
#    embedding model on a memory-tight box mid-backfill. qwen3.6 is therefore
#    left out of the boot set and started by hand when wanted:
#
#      podman start llm-inference-platform_qwen3.6_1
#
#    Nothing scheduled needs it: the LLM-as-judge eval leg is opt-in (`--judge`,
#    default off) and is skipped when the model is unset.
#
# ExecStart is reset to empty first — this is Type=oneshot, where a drop-in
# ExecStart= would otherwise *append* a second command rather than replace.
[Service]
ExecStartPre=-/usr/bin/timeout 120 /usr/bin/sh -c 'until test -e /run/windex-cdi-ready; do sleep 2; done'
ExecStart=
ExecStart=/usr/bin/podman-compose -p llm-inference-platform -f podman-compose.yaml up -d litellm-db litellm embeddings dcgm-exporter prometheus grafana
