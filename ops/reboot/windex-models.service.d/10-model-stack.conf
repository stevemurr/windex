# Two changes: wait for a usable CDI spec, and start the explicit production
# service set.
#
# 1. CDI gate. The GPU containers cannot start until nvidia-cdi-downconvert has
#    installed a 0.6.0 spec podman can read; at boot that service and this one
#    are in different systemd scopes (system vs user), so — as with the mount in
#    windex-data — we cannot express it as After= and poll a stamp file instead.
#    /run is tmpfs, so the stamp cannot survive a reboot and lie to us.
#    Non-fatal: on timeout we still bring up the CPU-only services (litellm,
#    prometheus, grafana) rather than leaving the box with nothing.
#
# 2. Explicit service list. Keep the managed stack intentional rather than
#    relying on every service declared in podman-compose.yaml. qwen3.6 is part
#    of the production system and starts alongside embeddings, LiteLLM, and
#    monitoring after the CDI gate is satisfied.
#
# ExecStart is reset to empty first — this is Type=oneshot, where a drop-in
# ExecStart= would otherwise *append* a second command rather than replace.
[Service]
ExecStartPre=-/usr/bin/timeout 120 /usr/bin/sh -c 'until test -e /run/windex-cdi-ready; do sleep 2; done'
ExecStart=
ExecStart=/usr/bin/podman-compose -p llm-inference-platform -f podman-compose.yaml up -d litellm-db litellm qwen3.6 embeddings dcgm-exporter prometheus grafana
