schema: windex.pipeline/1
parameters:
- key: request_interval
  kind: float
  lo: 3.0
  hi: 60
  default: 3.0
  unit: s
  label: Request interval
  help: arXiv ToU is 1 request / 3s from one connection.
- key: incremental_days
  kind: int
  lo: 1
  hi: 365
  default: 7
- key: earliest
  kind: date
  default: '2005-09-16'
  stage: install
  label: Backfill floor
  help: arXiv's own earliestDatestamp.
state:
  window:
    key: from..until
flows:
  harvest:
    inputs: []
    outputs: []
    nodes:
      windows:
        kind: discover
        uses: time.windows
        with:
          unit: day
          incremental_days: '@param.incremental_days'
          earliest: '@param.earliest'
      oai:
        kind: fetch
        uses: http.paginate
        with:
          protocol: oai_resumption
          allowed_hosts: export.arxiv.org
          request_interval: '@param.request_interval'
      records:
        kind: extract
        uses: oai.arxiv_records
        with: {}
      stage:
        kind: load
        uses: ledger.stage
        with:
          replace: false
    edges:
    - from:
        node: windows
      to:
        node: oai
    - from:
        node: oai
      to:
        node: records
    - from:
        node: records
      to:
        node: stage
refresh:
- harvest
