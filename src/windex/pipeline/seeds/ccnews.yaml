schema: windex.pipeline/1
parameters:
- key: backfill_days
  kind: int
  lo: 1
  hi: 3650
  default: 90
  label: Backfill window (days)
  help: How far back sync looks for unprocessed WARCs.
- key: language
  kind: str
  default: en
  stage: install
  label: Language
- key: dedup_window_days
  kind: int
  lo: 1
  hi: 365
  default: 30
  label: Near-dup window (days)
  help: News syndication crosses days; this is the MinHash comparison window.
- key: batch_warcs
  kind: int
  lo: 1
  hi: 64
  default: 8
  label: WARCs per slice
state:
  manifest:
    key: YYYY/MM
    order: key
  warc:
    key: WARC path
    order: key
flows:
  sync:
    inputs: []
    outputs: []
    nodes:
      months:
        kind: discover
        uses: time.calendar
        with:
          unit: month
          trailing_days: '@param.backfill_days'
          format: '%Y/%m'
          into: manifest
      listing:
        kind: fetch
        uses: http.download
        with:
          url_template: https://data.commoncrawl.org/crawl-data/CC-NEWS/{key}/warc.paths.gz
          allowed_hosts: data.commoncrawl.org
      paths:
        kind: catalog
        uses: list.path_manifest_gz
        with:
          key_pattern:
          - ^crawl-data/CC-NEWS/\d{4}/\d{2}/CC-NEWS-\d+-\d+\.warc\.gz$
          max_age_days: '@param.backfill_days'
      record:
        kind: collect
        uses: store.upsert
        with:
          store: warc
          on_conflict: skip
    edges:
    - from:
        node: months
      to:
        node: listing
    - from:
        node: listing
      to:
        node: paths
    - from:
        node: paths
      to:
        node: record
  ingest:
    inputs: []
    outputs: []
    nodes:
      pending:
        kind: discover
        uses: state.pending
        with:
          store: warc
          predicate: unseen
          order: key
          batch: '@param.batch_warcs'
          limit: '@param.batch_warcs'
          claim: lease
          stale_minutes: 60
      download:
        kind: fetch
        uses: http.download
        with:
          url_template: https://data.commoncrawl.org/{key}
          allowed_hosts: data.commoncrawl.org
          keep: false
      extract:
        kind: extract
        uses: warc.datatrove
        with:
          language: '@param.language'
          workers: 4
      canon:
        kind: transform
        uses: canonical.url
        with:
          strategy: sha1_of_canonical
      exact:
        kind: transform
        uses: dedup.exact
        with:
          scope: both
      near:
        kind: transform
        uses: dedup.minhash
        with:
          window_days: '@param.dedup_window_days'
      stage:
        kind: load
        uses: ledger.stage
        with:
          replace: false
    edges:
    - from:
        node: pending
      to:
        node: download
    - from:
        node: download
      to:
        node: extract
    - from:
        node: extract
      to:
        node: canon
    - from:
        node: canon
      to:
        node: exact
    - from:
        node: exact
      to:
        node: near
    - from:
        node: near
      to:
        node: stage
refresh:
- sync
- ingest
