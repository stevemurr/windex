schema: windex.pipeline/1
parameters:
- key: seeds
  kind: url_list
  max_items: 25
  required: true
  stage: install
  label: Seed URLs
  help: Scope defaults to the seed's own directory unless path_prefix says otherwise.
- key: same_host
  kind: bool
  default: true
  stage: install
- key: path_prefix
  kind: str
  stage: install
  help: Unset means the seed's directory. An explicit empty string means the whole host.
- key: exclude
  kind: regex_list
  max_items: 25
  max_len: 500
  stage: install
- key: max_pages
  kind: int
  lo: 1
  hi: 20000
  default: 500
  ceiling: crawl_max_pages_ceiling
  label: Page budget
- key: max_depth
  kind: int
  lo: 0
  hi: 8
  default: 2
  ceiling: crawl_max_depth_ceiling
- key: host_interval
  kind: float
  lo: 1.0
  hi: 300
  default: 2.0
  unit: s
  floor: crawl_host_interval_min
- key: prune
  kind: bool
  default: false
  label: Tombstone unseen pages
  help: The only setting that can DELETE content. Ignored on a truncated or failed run.
state:
  frontier:
    key: url
    order: depth, seq
flows:
  crawl:
    inputs: []
    outputs: []
    nodes:
      seed:
        kind: discover
        uses: crawl.frontier
        with:
          store: frontier
          seeds: '@param.seeds'
          max_pages: '@param.max_pages'
          batch: 50
      get:
        kind: fetch
        uses: http.get
        with:
          host_interval: '@param.host_interval'
      links:
        kind: catalog
        uses: crawl.links
        with:
          into: frontier
          max_depth: '@param.max_depth'
          same_host: '@param.same_host'
          path_prefix: '@param.path_prefix'
          exclude: '@param.exclude'
      front:
        kind: collect
        uses: store.upsert
        with:
          store: frontier
          on_conflict: skip
      text:
        kind: extract
        uses: html.trafilatura
        with:
          min_chars: 200
          structural_fallback: true
          honor_canonical: in_scope
      boiler:
        kind: transform
        uses: dedup.boilerplate
        with:
          repeat_cap: 2
      stage:
        kind: load
        uses: ledger.stage
        with:
          replace: '@param.prune'
          replace_scope: source
          replace_guard: census
    edges:
    - from:
        node: seed
      to:
        node: get
    - from:
        node: get
      to:
        node: links
    - from:
        node: links
      to:
        node: front
    - from:
        node: get
      to:
        node: text
    - from:
        node: text
      to:
        node: boiler
    - from:
        node: boiler
      to:
        node: stage
refresh:
- crawl
