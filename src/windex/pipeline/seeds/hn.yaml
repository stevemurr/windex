schema: windex.pipeline/1
parameters:
- key: request_interval
  kind: float
  lo: 0.1
  hi: 60
  default: 1.0
  unit: s
- key: incremental_days
  kind: int
  lo: 1
  hi: 365
  default: 2
state:
  window:
    key: from_ts..until_ts
flows:
  harvest:
    inputs: []
    outputs: []
    nodes:
      windows:
        kind: discover
        uses: time.windows
        with:
          unit: month
          incremental_days: '@param.incremental_days'
      algolia:
        kind: fetch
        uses: http.paginate
        with:
          protocol: algolia_numeric
          allowed_hosts: hn.algolia.com
          page_size: 1000
          result_cap: 1000
          split_on_cap: true
          request_interval: '@param.request_interval'
      stories:
        kind: extract
        uses: algolia.hn_stories
        with: {}
      exact:
        kind: transform
        uses: dedup.exact
        with:
          scope: ledger
      stage:
        kind: load
        uses: ledger.stage
        with:
          replace: false
    edges:
    - from:
        node: windows
      to:
        node: algolia
    - from:
        node: algolia
      to:
        node: stories
    - from:
        node: stories
      to:
        node: exact
    - from:
        node: exact
      to:
        node: stage
refresh:
- harvest
