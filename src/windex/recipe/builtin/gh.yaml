schema: windex.recipe/1
name: gh
version: 1
title: GitHub projects
description: >
  Repositories found by two independent paths — the GH Archive event tail and the
  date-sharded Search API sweep — converging on one repos store, then hydrated and
  composed into documents.
provenance:
  builtin: true
  upstream: https://api.github.com
  license: GitHub ToS
corpus: {source: github, id_prefix: "gh:", collection: repos}

config:
  - {key: tokens, kind: secret_ref, allow: [github_tokens], required: true,
     stage: install, label: GitHub tokens}
  - {key: star_threshold, kind: int, lo: 0, hi: 100000, default: 10,
     label: Star threshold, help: Minimum stars for a repo to be indexed.}
  - {key: archive_tail_days, kind: int, lo: 0, hi: 3650, default: 2,
     label: GH Archive tail (days)}
  - {key: hydrate_limit, kind: int, lo: 1, hi: 500000, default: 100000}

state:
  gh_hours:  {key: "YYYY-MM-DD-H.json.gz", order: key}
  gh_shards: {key: "from..to@threshold"}
  repos:     {key: repo id, order: stars desc}

flows:
  # THE FAN-IN. Two discovery paths, one store. This is the shape that made a
  # fixed-vocabulary DAG worth having over a linear stage list.
  discover:
    nodes:
      hours:    {kind: discover, uses: time.calendar,
                 with: {unit: hour, trailing_days: "@config.archive_tail_days",
                        into: gh_hours, format: "%Y-%m-%d-{h}.json.gz"}}
      hourfile: {kind: fetch, uses: http.download,
                 with: {url_template: "https://data.gharchive.org/{key}",
                        allowed_hosts: "data.gharchive.org", missing_ok: true}}
      watch:    {kind: catalog, uses: github.watch_events,
                 with: {event_type: WatchEvent}}

      shards:   {kind: discover, uses: state.pending,
                 with: {store: gh_shards, predicate: rearm, rearm_days: 7}}
      search:   {kind: fetch, uses: http.paginate,
                 with: {protocol: github_search_pages, allowed_hosts: "api.github.com",
                        token_ref: "@secret.github_tokens", page_size: 100,
                        result_cap: 1000, split_on_cap: true, request_interval: 2.1}}
      items:    {kind: catalog, uses: github.search_items, with: {}}

      repos:    {kind: collect, uses: store.repos, with: {store: repos}}
    edges:
      - [hours, hourfile]
      - [hourfile, watch]
      - [watch, repos]          # fan-in edge 1: the GH Archive tail
      - [shards, search]
      - [search, items]
      - [items, repos]          # fan-in edge 2: the Search API sweep

  hydrate:
    nodes:
      cands: {kind: discover, uses: state.repos_pending,
              with: {store: repos, stages: candidate, order: star_events_desc,
                     batch: 40, limit: "@config.hydrate_limit"}}
      gql:   {kind: fetch, uses: github.graphql_batch,
              with: {batch: 40, token_ref: "@secret.github_tokens"}}
      meta:  {kind: catalog, uses: github.hydrated_repos,
              with: {stars_gte: "@config.star_threshold"}}
      back:  {kind: collect, uses: store.repos, with: {store: repos}}
    edges: [[cands, gql], [gql, meta], [meta, back]]

  # Compose documents from the hydrated rows. Split out from embedding on purpose:
  # gh used to do compose+embed+upsert in one hand-rolled pass, so it missed the
  # shared driver's durability ordering, pause handling and poison-doc isolation.
  compose:
    nodes:
      ready:  {kind: discover, uses: state.repos_pending,
               with: {store: repos, stages: hydrated, order: stars_desc, batch: 512}}
      readme: {kind: fetch, uses: local.parquet_lookup,
               with: {dir: "repos/readme", key_column: repo_id, value_column: readme}}
      doc:    {kind: extract, uses: github.compose_doc, with: {}}
      stage:  {kind: load, uses: ledger.stage, with: {replace: false}}
    edges: [[ready, readme], [readme, doc], [doc, stage]]

refresh: [discover, hydrate, compose]
