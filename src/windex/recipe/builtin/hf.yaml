schema: windex.recipe/1
name: hf
version: 1
title: Hugging Face docs and blog
description: >
  Two stores feeding one corpus — doc roots gated on their llms.txt hash, blog
  posts on sitemap lastmod. The case that made partition-scoped replace necessary.
provenance: {builtin: true, upstream: "https://huggingface.co", license: HF ToS}
corpus: {source: hf, id_prefix: "hf:", collection: hf}
config:
  # 3.0s mirrors HF's own published budget.
  - {key: request_interval, kind: float, lo: 3.0, hi: 60, default: 3.0, unit: s}
  - {key: roots, kind: csv, default: "", stage: install, label: Doc roots,
     help: Empty means every root in the sitemap.}
state:
  root: {key: doc root, order: key}
  post: {key: blog slug, order: lastmod}
flows:
  sync:
    nodes:
      once:  {kind: discover, uses: static.once, with: {key: sitemap}}
      site:  {kind: fetch, uses: http.get,
              with: {host_interval: "@config.request_interval"}}
      roots: {kind: catalog, uses: list.sitemap,
              with: {shard_allow: "sitemap-doc.xml"}}
      posts: {kind: catalog, uses: list.sitemap,
              with: {shard_allow: "sitemap-blog.xml"}}
      rec_roots: {kind: collect, uses: store.upsert, with: {store: root}}
      rec_posts: {kind: collect, uses: store.upsert, with: {store: post}}
    edges: [[once, site], [site, roots], [site, posts],
            [roots, rec_roots], [posts, rec_posts]]
  crawl:
    nodes:
      # Two discover branches, two fetches, two extracts — converging on ONE load.
      # The docs/blog write-mode difference is not two load nodes: it is
      # replace_scope=partition, where a doc root's id_scope covers its whole
      # subtree and a blog post's covers exactly itself, so replace is a no-op there.
      roots:    {kind: discover, uses: state.pending,
                 with: {store: root, predicate: token_moved, order: key, batch: 4}}
      root_md:  {kind: fetch, uses: http.get,
                 with: {host_interval: "@config.request_interval"}}
      md:       {kind: extract, uses: markdown.passthrough, with: {}}

      posts:    {kind: discover, uses: state.pending,
                 with: {store: post, predicate: token_moved, order: ord, batch: 20}}
      post_html: {kind: fetch, uses: http.get,
                  with: {host_interval: "@config.request_interval"}}
      html:     {kind: extract, uses: html.trafilatura, with: {min_chars: 200}}

      stage:    {kind: load, uses: ledger.stage,
                 with: {replace: true, replace_scope: partition, replace_guard: census}}
    edges: [[roots, root_md], [root_md, md], [md, stage],
            [posts, post_html], [post_html, html], [html, stage]]
refresh: [sync, crawl]
