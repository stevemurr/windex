schema: windex.recipe/1
name: hn
version: 1
title: Hacker News
description: Stories over epoch windows via the Algolia search API.
provenance: {builtin: true, upstream: "https://hn.algolia.com/api", license: HN ToU}
corpus: {source: hn, id_prefix: "hn:", collection: hn}
config:
  - {key: request_interval, kind: float, lo: 0.1, hi: 60, default: 1.0, unit: s}
  - {key: incremental_days, kind: int, lo: 1, hi: 365, default: 2}
state:
  window: {key: "from_ts..until_ts"}
flows:
  harvest:
    nodes:
      windows: {kind: discover, uses: time.windows,
                with: {unit: month, incremental_days: "@config.incremental_days"}}
      algolia: {kind: fetch, uses: http.paginate,
                with: {protocol: algolia_numeric, allowed_hosts: "hn.algolia.com",
                       page_size: 1000, result_cap: 1000, split_on_cap: true,
                       request_interval: "@config.request_interval"}}
      stories: {kind: extract, uses: algolia.hn_stories, with: {}}
      exact:   {kind: transform, uses: dedup.exact, with: {scope: ledger}}
      stage:   {kind: load, uses: ledger.stage, with: {replace: false}}
    edges: [[windows, algolia], [algolia, stories], [stories, exact], [exact, stage]]
refresh: [harvest]
