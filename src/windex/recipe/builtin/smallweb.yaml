schema: windex.recipe/1
name: smallweb
version: 1
title: Small Web
description: >
  Independent blogs from the Kagi Small Web feed list. Rotation-polled rather than
  content-gated: there is no cheap upstream signal across 38k feeds.
provenance: {builtin: true, upstream: "https://github.com/kagisearch/smallweb",
             license: per-blog}
corpus: {source: smallweb, id_prefix: "smallweb:", collection: smallweb}
config:
  - {key: host_interval, kind: float, lo: 1.0, hi: 300, default: 2.0, unit: s,
     label: Per-host interval}
  - {key: max_items, kind: int, lo: 1, hi: 200, default: 20, label: Items per feed}
  - {key: poll_batch, kind: int, lo: 1, hi: 5000, default: 1000, label: Feeds per slice}
  - {key: min_chars, kind: int, lo: 0, hi: 100000, default: 200,
     label: Minimum post length,
     help: A light gate. The FineWeb/C4 filters over-reject personal blogs.}
state:
  feed: {key: feed url, order: processed_at}
flows:
  sync:
    nodes:
      once:  {kind: discover, uses: static.once, with: {key: feed-list}}
      list:  {kind: fetch, uses: http.download,
              with: {url_template: "https://raw.githubusercontent.com/kagisearch/smallweb/main/smallweb.txt",
                     allowed_hosts: "raw.githubusercontent.com"}}
      # shrink_floor: a truncated fetch must not look like mass deletion.
      feeds: {kind: catalog, uses: list.lines, with: {shrink_floor: 200}}
      record: {kind: collect, uses: store.upsert,
               with: {store: feed, on_conflict: merge, max_attempts: 10}}
    edges: [[once, list], [list, feeds], [feeds, record]]
  poll:
    nodes:
      due:   {kind: discover, uses: state.pending,
              with: {store: feed, predicate: rotate, order: processed_at,
                     batch: "@config.poll_batch"}}
      fetch: {kind: fetch, uses: http.get,
              with: {host_interval: "@config.host_interval", conditional: true}}
      posts: {kind: extract, uses: feed.inline_docs, with: {}}
      clean: {kind: transform, uses: canonical.url, with: {strategy: path_suffix}}
      stage: {kind: load, uses: ledger.stage, with: {replace: false}}
    edges: [[due, fetch], [fetch, posts], [posts, clean], [clean, stage]]
refresh: [sync, poll]
