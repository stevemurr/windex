schema: windex.recipe/1
name: wiki
version: 1
title: Wikipedia
description: CirrusSearch dump shards, streamed rather than materialized.
provenance: {builtin: true, upstream: "https://dumps.wikimedia.org", license: CC BY-SA}
corpus: {source: wiki, id_prefix: "wiki:", collection: wiki}
config:
  - {key: dump, kind: str, default: enwiki, stage: install, label: Dump}
  - {key: chunk_rows, kind: int, lo: 100, hi: 50000, default: 2000, label: Chunk rows}
state:
  shard: {key: shard filename, order: key}
flows:
  sync:
    nodes:
      once:    {kind: discover, uses: static.once, with: {key: dump-index}}
      index:   {kind: fetch, uses: http.download,
                with: {url_template: "https://dumps.wikimedia.org/other/cirrussearch/current/",
                       allowed_hosts: "dumps.wikimedia.org"}}
      # require_marker: a dump still being written has no completeness marker, and
      # ingesting a partial shard is worse than waiting a day.
      shards:  {kind: catalog, uses: list.apache_index,
                with: {require_marker: "_SUCCESS", newest_only: true}}
      record:  {kind: collect, uses: store.upsert, with: {store: shard, on_conflict: skip}}
    edges: [[once, index], [index, shards], [shards, record]]
  ingest:
    nodes:
      pending: {kind: discover, uses: state.pending,
                with: {store: shard, predicate: token_moved, order: key, batch: 1,
                       claim: lease, stale_minutes: 60}}
      shard:   {kind: fetch, uses: http.download,
                with: {url_template: "https://dumps.wikimedia.org/other/cirrussearch/current/{key}",
                       allowed_hosts: "dumps.wikimedia.org", keep: false}}
      pages:   {kind: extract, uses: cirrus.articles, with: {chunk_rows: "@config.chunk_rows"}}
      stage:   {kind: load, uses: ledger.stage, with: {replace: false}}
    edges: [[pending, shard], [shard, pages], [pages, stage]]
refresh: [sync, ingest]
